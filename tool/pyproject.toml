[project]
name = "socnhotv"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch",
    "torchaudio",
    "faster-whisper",
    "imageio-ffmpeg",
    "edge-tts",
    "numpy",
    "soundfile",
    "fastapi",
    "uvicorn",
    "pydantic",
    "sse-starlette",
    "pillow",
    "pyyaml",
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
