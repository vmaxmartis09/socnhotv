[project]
name = "socnhotv"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch",
    "torchaudio",
    "faster-whisper",
    "imageio-ffmpeg",
    "edge-tts",
    "numpy",
    "soundfile",
    "fastapi",
    "uvicorn",
    "pydantic",
    "sse-starlette",
    "pillow",
    "pyyaml",
    "pytest",
    "httpx",
    "yt-dlp",
    "scenedetect[opencv]",
    "imagehash",
    "apscheduler>=3.10",
    "google-api-python-client",
    "google-auth-oauthlib",
    "jinja2",
    "python-dateutil",
    "rapidfuzz",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["tool/src"]

[tool.pytest.ini_options]
pythonpath = ["tool/src"]
testpaths = ["tool/tests"]
