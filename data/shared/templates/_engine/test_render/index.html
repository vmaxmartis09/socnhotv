<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=540, height=960, initial-scale=1.0" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 540px; height: 960px; overflow: hidden; background: #0f172a; font-family: sans-serif; color: white; }
    #root { position: relative; width: 540px; height: 960px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .box { width: 300px; height: 300px; background: linear-gradient(135deg, #f43f5e, #fb923c); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="2.0" data-width="540" data-height="960" data-fps="24">
    <div id="mybox" class="box clip" data-start="0" data-duration="2.0">TEST HYPERFRAMES</div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#mybox", { scale: 0.5, rotation: -15, opacity: 0 }, { scale: 1.0, rotation: 0, opacity: 1, duration: 1.0, ease: "power2.out" });
    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
